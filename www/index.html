<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IPTV Cast</title>
<style>
:root{--bg:#fff;--fg:#14161a;--mut:#6b7280;--card:#f1f3f6;--acc:#2563eb;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e8eaee;--mut:#9aa1ad;--card:#1a1d24;--acc:#5b8cff}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{position:sticky;top:0;background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;gap:8px;z-index:2}
.row{display:flex;gap:8px}
input,select,button{font:inherit;color:inherit;background:var(--card);border:0;border-radius:10px;padding:10px 12px}
input{flex:1;min-width:0}
button{cursor:pointer}button.p{background:var(--acc);color:#fff}
#cast{font-size:13px;color:var(--mut)}
ul{list-style:none;margin:0;padding:4px 12px 24px}
li{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--card);margin-bottom:6px}
li img{width:40px;height:40px;object-fit:contain;border-radius:8px;background:#0003}
li .t{flex:1;min-width:0}li .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li .g{font-size:12px;color:var(--mut)}
#msg{padding:12px;color:var(--mut);font-size:14px}
</style></head><body>
<header>
  <div class="row"><input id="url" type="url" placeholder="URL плейлиста M3U / M3U8"><button class="p" id="load">Загрузить</button></div>
  <div class="row"><input id="q" placeholder="Поиск"><select id="grp"><option value="">Все группы</option></select></div>
  <div id="cast">Cast: не подключён</div>
</header>
<div id="msg">Добавьте ссылку на свой M3U-плейлист. Приложение не содержит каналов и не предоставляет контент.</div>
<ul id="list"></ul>
<script>
const $=s=>document.querySelector(s);
const C=window.Capacitor, native=C&&C.isNativePlatform&&C.isNativePlatform();
const N=native?C.registerPlugin('IptvNative'):null;
let all=[];
const msg=t=>$('#msg').textContent=t;

function parse(t){const out=[];let m=null;
  for(const l of t.split(/\r?\n/)){const s=l.trim();
    if(s.startsWith('#EXTINF')){
      m={name:s.slice(s.lastIndexOf(',')+1).trim()||'Без названия',
         logo:(s.match(/tvg-logo="([^"]*)"/)||[])[1]||'',
         group:(s.match(/group-title="([^"]*)"/)||[])[1]||'Без группы'};
    }else if(s&&!s.startsWith('#')&&m){m.url=s;out.push(m);m=null}}
  return out}

async function download(url){
  if(native){const r=await C.Plugins.CapacitorHttp.get({url,responseType:'text'});
    if(r.status>=400)throw new Error('HTTP '+r.status);return String(r.data)}
  const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}

async function load(){
  const url=$('#url').value.trim();if(!url)return;
  msg('Загрузка…');
  try{all=parse(await download(url));
    localStorage.setItem('pl',url);
    const gs=[...new Set(all.map(c=>c.group))].sort();
    $('#grp').replaceChildren(new Option('Все группы',''),...gs.map(g=>new Option(g,g)));
    render();
  }catch(e){msg('Ошибка: '+e.message)}}

function render(){
  const q=$('#q').value.toLowerCase(),g=$('#grp').value;
  const f=all.filter(c=>(!g||c.group===g)&&c.name.toLowerCase().includes(q));
  msg(`Каналов: ${f.length}${f.length>300?' (показаны первые 300)':''}`);
  $('#list').replaceChildren(...f.slice(0,300).map(c=>{
    const li=document.createElement('li');
    const im=document.createElement('img');im.loading='lazy';im.src=c.logo;im.onerror=()=>im.style.visibility='hidden';
    const t=document.createElement('div');t.className='t';
    const n=document.createElement('div');n.className='n';n.textContent=c.name;
    const gr=document.createElement('div');gr.className='g';gr.textContent=c.group;t.append(n,gr);
    const p=document.createElement('button');p.textContent='▶';p.onclick=()=>play(c);
    const k=document.createElement('button');k.textContent='📺';k.onclick=()=>cast(c);
    li.append(im,t,p,k);return li}));}

async function play(c){
  if(!native)return window.open(c.url);
  try{await N.play({url:c.url,title:c.name})}catch(e){msg('Ошибка: '+e.message)}}

async function cast(c){
  if(!native)return msg('Cast работает только в Android-приложении');
  try{const s=await N.castState();
    if(!s.connected){await N.castPicker();msg('Выберите ТВ, затем нажмите 📺 ещё раз');return}
    await N.castLoad({url:c.url,title:c.name});msg('Отправлено на '+s.device)
  }catch(e){msg('Ошибка Cast: '+e.message)}}

async function poll(){if(!native)return;
  try{const s=await N.castState();$('#cast').textContent=s.connected?'Cast: '+s.device:'Cast: не подключён'}catch(_){}}
$('#load').onclick=load;$('#q').oninput=render;$('#grp').onchange=render;
$('#url').value=localStorage.getItem('pl')||'';
if($('#url').value)load();
setInterval(poll,2500);
</script></body></html>
