name: Android build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # нужно, чтобы публиковать релиз

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 требует Node 22+ и Java 21.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm run sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        id: apk
        run: bash .github/scripts/name-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-Cast-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.apk.outputs.version }}
          FILE: ${{ steps.apk.outputs.file }}
        run: bash .github/scripts/publish-release.sh
